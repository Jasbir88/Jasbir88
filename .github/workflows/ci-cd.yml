name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 23 * * 1,5'  # Every Monday and Friday at 11PM UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================
  # Detect Changes
  # ============================================
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      javascript: ${{ steps.filter.outputs.javascript }}
      bash: ${{ steps.filter.outputs.bash }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect File Changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - '.github/workflows/ci-cd.yml'
              - '.gitmodules'
              - '.flake8'
              - '.black'
              - 'pytest.ini'
              - 'setup.cfg'
              - 'tox.ini'
              - '**/*.py'
              - 'requirements*.txt'
              - 'setup.py'
              - 'pyproject.toml'
            javascript:
              - '**/*.js'
              - '**/*.ts'
              - '**/*.jsx'
              - '**/*.tsx'
              - 'package*.json'
              - 'tsconfig.json'
            bash:
              - '**/*.sh'
              - '**/*.bash'
            docker:
              - 'Dockerfile*'
              - 'docker-compose*.yml'
              - '.dockerignore'

  # ============================================
  # Python Linting and Testing
  # ============================================
  python-lint-test:
    name: 🐍 Python Lint & Test
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.python == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Python Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            .venv
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          # Check if requirements.txt exists
          if [ -f "requirements.txt" ]; then
            echo "📦 Installing from requirements.txt..."
            pip install -r requirements.txt
          fi

          # Install dev dependencies if they exist
          if [ -f "requirements-dev.txt" ]; then
            echo "📦 Installing dev dependencies..."
            pip install -r requirements-dev.txt
          else
            # Install common testing tools
            pip install pytest pytest-cov flake8 black isort
          fi

      - name: Lint with Flake8
        run: |
          if [ -f ".flake8" ] || [ -f "setup.cfg" ] || [ -f "tox.ini" ]; then
            echo "🔍 Running Flake8..."
            flake8 .
          else
            echo "⏭️ No Flake8 configuration found, skipping..."
          fi

      - name: Format Check with Black
        run: |
          if [ -f "pyproject.toml" ] || [ -f ".black" ]; then
            echo "🎨 Checking Black formatting..."
            black --check .
          else
            echo "⏭️ No Black configuration found, skipping..."
          fi

      - name: Run Tests
        run: |
          if [ -d "tests" ] || [ -d "test" ]; then
            echo "🧪 Running tests with pytest..."
            pytest -v --cov=. --cov-report=xml --cov-report=html
          else
            echo "No test directory found."
            exit 1
          fi
